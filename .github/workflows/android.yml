name: Android checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test, build and lint
        run: |
          python3 scripts/build_localizations.py
          git diff --exit-code -- app/src/main/res app/src/main/assets/localized-patterns.json app/src/main/java/org/eightbit/bite/ui/TranslatedIds.kt
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check_catalogue.py
          sh gradlew :core:test :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: 8bitBites-development-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 8bitBites-check-reports
          path: |
            app/build/reports/
            core/build/reports/
          if-no-files-found: ignore
          retention-days: 14
